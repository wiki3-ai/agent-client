name: Integration (nightly)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Full integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,llm]"

      - name: Run all integration + slow tests (LLM tests skipped without LM Studio)
        run: pytest tests/integration -v -m "integration and not llm"
