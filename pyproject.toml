[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-kernel"
version = "0.0.1"
description = "Python-first JupyterLab server-side Agent Kernel: notebook-native agent authoring, orchestration, and provenance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "wiki3-ai" }]
keywords = ["jupyter", "kernel", "agent", "llm", "provenance", "nbclient"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.7",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "typing-extensions>=4.10",
    "click>=8.1",
]

[project.optional-dependencies]
server = [
    "jupyter_server>=2.14",
    "tornado>=6.4",
]
llm = [
    "litellm>=1.40",
    "instructor>=1.3",
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
agent-kernel = "agent_kernel.cli:main"

[project.entry-points."jupyter_serverproc_extensions"]
agent_kernel_server = "agent_kernel_server"

[project.entry-points."jupyter_serverproc.extensions"]
agent_kernel_server = "agent_kernel_server"

[tool.hatch.build.targets.wheel]
packages = ["agent_kernel", "agent_kernel_server"]

[tool.hatch.build.targets.wheel.force-include]
"agent_kernel/templates/python-analysis.ipynb" = "agent_kernel/templates/python-analysis.ipynb"

[tool.hatch.build.targets.wheel.shared-data]
"agent_kernel/kernelspec" = "share/jupyter/kernels/agent-kernel"
"agent_kernel_server/jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/fixtures/notebooks", "docs/schemas", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["agent_kernel.models.*", "agent_kernel.runtime.*", "agent_kernel.storage.*"]
strict = true

[[tool.mypy.overrides]]
module = ["nbclient.*", "nbformat.*", "ipykernel.*", "litellm.*", "instructor.*", "jupyter_server.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "unit: fast, hermetic unit tests",
    "integration: end-to-end tests using real runtimes (nbclient, filesystem, kernels)",
    "slow: tests that may take >30s",
    "llm: tests that require a running LM Studio (or compatible OpenAI endpoint)",
]
asyncio_mode = "auto"
timeout = 120
